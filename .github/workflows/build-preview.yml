name: Preview Build + Release

on:
  push:
    branches: [main]

jobs:
  build:
    name: EAS Preview Build (Android)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build preview APK
        run: eas build --profile preview --platform android --non-interactive --wait --json > build-output.json

      - name: Extract APK URL
        run: echo "APK_URL=$(jq -r '.[0].artifacts.buildUrl' build-output.json)" >> $GITHUB_ENV

      - name: Download APK
        run: curl -L "$APK_URL" -o safe-travels.apk

      - name: Get app version
        run: echo "APP_VERSION=$(jq -r '.version' package.json)" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-build.${{ github.run_number }}
          name: Safe Travels v${{ env.APP_VERSION }}
          files: safe-travels.apk
          body: |
            Build gerado automaticamente após merge em `main`.

            **Como instalar no Android:**
            1. Baixe o arquivo `safe-travels.apk` abaixo
            2. Abra no celular
            3. Se pedido, habilite "Instalar de fontes desconhecidas"
            4. Instale e abra o app

            **Commit:** ${{ github.sha }}
